<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YOUR SHOP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <header class="nav">
    <a class="logo" href="index.html" data-name>YOUR SHOP</a>
    <nav class="nav-links">
      <a href="#services">Services</a>
      <a href="#process">Process</a>
      <a href="about.html">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="btn btn-sm" href="#contact" data-nav-cta>Call now</a>
  </header>
  <main>
    <section class="section contact">
      <p class="kicker">Contact</p>
      <form onsubmit="event.preventDefault(); this.querySelector('[type=submit]').textContent='Got it';">
        <div class="row3">
          <label>Name <input required name="name" /></label>
          <label>Email <input required type="email" name="email" /></label>
          <label>Phone <input required name="phone" /></label>
        </div>
        <label>What do you need? <textarea required rows="4" name="msg"></textarea></label>
        <button class="btn" type="submit">Request a site</button>
      </form>
    </section>
  </main>

  <footer>© <span data-name>YOUR SHOP</span>. All rights reserved.</footer>
  <script src="config.js"></script>
  <script src="apply.js"></script>
</body>
</html>
